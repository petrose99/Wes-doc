services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: docubite
      POSTGRES_PASSWORD: docubite
      POSTGRES_DB: document_inbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docubite"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
