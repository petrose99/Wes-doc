services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: docubite
      POSTGRES_PASSWORD: docubite
      POSTGRES_DB: document_inbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docubite"]
      interval: 5s
      timeout: 3s
      retries: 5

  bigcapital-db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: bigcapital
      MYSQL_DATABASE: bigcapital
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  bigcapital-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bigcapital-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  bigcapital-minio-init:
    image: minio/mc:latest
    depends_on:
      bigcapital-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://bigcapital-minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/bigcapital;
      exit 0;
      "

  bigcapital-server:
    image: bigcapitalhq/server:latest
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      DB_HOST: bigcapital-db
      DB_USER: root
      DB_PASSWORD: bigcapital
      DB_CHARSET: utf8
      SYSTEM_DB_NAME: bigcapital
      TENANT_DB_NAME_PREFIX: bigcapital_tenant_
      MAIL_HOST: "${BIGCAPITAL_MAIL_HOST:-}"
      MAIL_PORT: "${BIGCAPITAL_MAIL_PORT:-587}"
      MAIL_USERNAME: "${BIGCAPITAL_MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${BIGCAPITAL_MAIL_PASSWORD:-}"
      REDIS_HOST: bigcapital-redis
      REDIS_PORT: "6379"
      QUEUE_HOST: bigcapital-redis
      QUEUE_PORT: "6379"
      BASE_URL: http://localhost:4000
      SIGNUP_DISABLED: "false"
      AGENDASH_AUTH_USER: admin
      AGENDASH_AUTH_PASSWORD: admin
      S3_REGION: us-east-1
      S3_BUCKET: bigcapital
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://bigcapital-minio:9000
    depends_on:
      bigcapital-db:
        condition: service_healthy
      bigcapital-redis:
        condition: service_healthy
      bigcapital-minio-init:
        condition: service_completed_successfully

  bigcapital-webapp:
    image: bigcapitalhq/webapp:latest
    restart: unless-stopped
    ports:
      - "4001:80"
    environment:
      API_BASE_URL: http://localhost:4000
    volumes:
      - ./bigcapital/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./bigcapital/auth-bridge.html:/usr/share/nginx/html/auth-bridge.html:ro
      - ./bigcapital/docubite-theme.css:/usr/share/nginx/html/docubite-theme.css:ro
      - ./bigcapital/docubite-theme.js:/usr/share/nginx/html/docubite-theme.js:ro
    depends_on:
      - bigcapital-server

volumes:
  pgdata:
  mysql_data:
  minio_data:
