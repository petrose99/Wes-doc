name: docubite

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docubite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-document_inbox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docubite}"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    env_file: .env.production
    # Uploaded document sources. With no S3 bucket configured, lib/document-storage.ts writes them
    # to DOCUMENT_SOURCE_PATH on local disk — so without this volume they landed in the web
    # container's own writable layer, where the worker could not see them (every extraction failed
    # with ENOENT) and where `docker compose up -d web` destroyed them outright. The path is set
    # explicitly rather than left to the code's ./data default so the mount point and the code
    # cannot drift apart if WORKDIR ever changes.
    environment:
      DOCUMENT_SOURCE_PATH: /app/data/document-sources
    volumes:
      - document_sources:/app/data/document-sources
    ports:
      - "127.0.0.1:7331:7331"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env.production
    # Uploaded document sources. With no S3 bucket configured, lib/document-storage.ts writes them
    # to DOCUMENT_SOURCE_PATH on local disk — so without this volume they landed in the web
    # container's own writable layer, where the worker could not see them (every extraction failed
    # with ENOENT) and where `docker compose up -d web` destroyed them outright. The path is set
    # explicitly rather than left to the code's ./data default so the mount point and the code
    # cannot drift apart if WORKDIR ever changes.
    environment:
      DOCUMENT_SOURCE_PATH: /app/data/document-sources
    volumes:
      - document_sources:/app/data/document-sources
    depends_on:
      db:
        condition: service_healthy

  bigcapital-db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${BIGCAPITAL_MYSQL_ROOT_PASSWORD:?BIGCAPITAL_MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: bigcapital
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  bigcapital-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bigcapital-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${BIGCAPITAL_MINIO_ROOT_PASSWORD:?BIGCAPITAL_MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  bigcapital-minio-init:
    image: minio/mc:latest
    depends_on:
      bigcapital-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://bigcapital-minio:9000 minioadmin ${BIGCAPITAL_MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/bigcapital;
      exit 0;
      "

  bigcapital-server:
    image: bigcapitalhq/server:latest
    restart: unless-stopped
    environment:
      DB_HOST: bigcapital-db
      DB_USER: root
      DB_PASSWORD: ${BIGCAPITAL_MYSQL_ROOT_PASSWORD}
      DB_CHARSET: utf8
      SYSTEM_DB_NAME: bigcapital
      TENANT_DB_NAME_PREFIX: bigcapital_tenant_
      MAIL_HOST: "${BIGCAPITAL_MAIL_HOST:-}"
      MAIL_PORT: "${BIGCAPITAL_MAIL_PORT:-587}"
      MAIL_USERNAME: "${BIGCAPITAL_MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${BIGCAPITAL_MAIL_PASSWORD:-}"
      REDIS_HOST: bigcapital-redis
      REDIS_PORT: "6379"
      QUEUE_HOST: bigcapital-redis
      QUEUE_PORT: "6379"
      BASE_URL: ${BIGCAPITAL_API_BASE:?BIGCAPITAL_API_BASE must be set, e.g. https://your-domain/bigcapital-api}
      SIGNUP_DISABLED: "false"
      AGENDASH_AUTH_USER: admin
      AGENDASH_AUTH_PASSWORD: ${BIGCAPITAL_AGENDASH_PASSWORD:?BIGCAPITAL_AGENDASH_PASSWORD must be set}
      S3_REGION: us-east-1
      S3_BUCKET: bigcapital
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: ${BIGCAPITAL_MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: http://bigcapital-minio:9000
    depends_on:
      bigcapital-db:
        condition: service_healthy
      bigcapital-redis:
        condition: service_healthy
      bigcapital-minio-init:
        condition: service_completed_successfully

  bigcapital-webapp:
    image: bigcapitalhq/webapp:latest
    restart: unless-stopped
    environment:
      API_BASE_URL: ${BIGCAPITAL_API_BASE}
    # These are single-FILE bind mounts, which bind an inode, not a path. `git pull` replaces a
    # changed file by rename, so the container keeps serving the old contents until it is
    # restarted — a pull alone deploys nothing here, however convincing the host file looks.
    volumes:
      - ./bigcapital/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./bigcapital/auth-bridge.html:/usr/share/nginx/html/auth-bridge.html:ro
      - ./bigcapital/docubite-theme.css:/usr/share/nginx/html/docubite-theme.css:ro
      - ./bigcapital/docubite-theme.js:/usr/share/nginx/html/docubite-theme.js:ro
      - ./bigcapital/docubite-mark.svg:/usr/share/nginx/html/docubite-mark.svg:ro
    depends_on:
      - bigcapital-server

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The Caddyfile interpolates {$DOCUBITE_DOMAIN} etc. — without these, each expands to empty,
    # Caddy reads "{ }" as an empty site address opening a global-options block instead, and every
    # directive after it fails to parse ("unrecognized global option: reverse_proxy").
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - bigcapital-webapp

volumes:
  document_sources:
  pgdata:
  mysql_data:
  minio_data:
  caddy_data:
  caddy_config:
