name: docubite

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docubite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-document_inbox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d is not optional: without it pg_isready connects to a database named after the user,
      # which does not exist here (the database is document_inbox). The check still passed —
      # it only reports whether the server accepts connections — while Postgres logged a FATAL
      # every 5s, roughly 17k lines a day, enough to bury a real error.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docubite} -d ${POSTGRES_DB:-document_inbox}"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    env_file: .env.production
    # Uploaded document sources. With no S3 bucket configured, lib/document-storage.ts writes them
    # to DOCUMENT_SOURCE_PATH on local disk — so without this volume they landed in the web
    # container's own writable layer, where the worker could not see them (every extraction failed
    # with ENOENT) and where `docker compose up -d web` destroyed them outright. The path is set
    # explicitly rather than left to the code's ./data default so the mount point and the code
    # cannot drift apart if WORKDIR ever changes.
    environment:
      DOCUMENT_SOURCE_PATH: /app/data/document-sources
    volumes:
      - document_sources:/app/data/document-sources
    ports:
      - "127.0.0.1:7331:7331"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env.production
    # Uploaded document sources. With no S3 bucket configured, lib/document-storage.ts writes them
    # to DOCUMENT_SOURCE_PATH on local disk — so without this volume they landed in the web
    # container's own writable layer, where the worker could not see them (every extraction failed
    # with ENOENT) and where `docker compose up -d web` destroyed them outright. The path is set
    # explicitly rather than left to the code's ./data default so the mount point and the code
    # cannot drift apart if WORKDIR ever changes.
    environment:
      DOCUMENT_SOURCE_PATH: /app/data/document-sources
    volumes:
      - document_sources:/app/data/document-sources
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The Caddyfile interpolates {$DOCUBITE_DOMAIN} etc. — without these, each expands to empty,
    # Caddy reads "{ }" as an empty site address opening a global-options block instead, and every
    # directive after it fails to parse ("unrecognized global option: reverse_proxy").
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  document_sources:
  pgdata:
  caddy_data:
  caddy_config:
