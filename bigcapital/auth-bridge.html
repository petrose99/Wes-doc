<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Signing in…</title>
<link rel="icon" href="/docubite-mark.svg" type="image/svg+xml">
<style>
/* Deliberately identical to the SPA's boot splash (see docubite-theme.css) — this page is on
 * screen for one network hop between DocuBite and the accounting app, and anything that isn't a
 * pixel match reads as a flash of a broken page. */
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  background: #fafbfc;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.center { margin: auto; display: flex; flex-direction: column; text-align: center; }
.center img { width: 52px; height: 52px; margin: 0 auto; }
.wordmark { margin-top: 10px; color: #0f172a; font-size: 17px; font-weight: 700; letter-spacing: -0.03em; }
.status { margin-top: 6px; color: #64748b; font-size: 13px; }
</style>
</head>
<body>
<div class="center">
  <img src="/docubite-mark.svg" alt="">
  <div class="wordmark">DocuBite</div>
  <div class="status" id="status">Signing you in…</div>
</div>
<script>
/* Hands a server-minted Bigcapital session to the Bigcapital SPA.
 *
 * The SPA's authentication slice is persisted with `whitelist: []`, so redux-persist stores
 * nothing of it — its localStorage key holds only `_persist`. The slice's initial state is read
 * back from COOKIES instead:
 *
 *   token: getCookie("token") | organizationId: getCookie("organization_id")
 *   userId: getCookie("authenticated_user_id")
 *
 * and `isAuthenticated = !!state.authentication.token`. Its own login page writes exactly these
 * four cookies from the snake_case /api/auth/signin body (token, authenticated_user_id,
 * organization_id, tenant_id) at path "/", 1 day, or 30 with "remember me". Writing them here is
 * therefore the whole handover: the SPA cannot tell this apart from a login it performed itself.
 *
 * Do NOT go back to writing `persist:bigcapital:authentication` — with an empty whitelist nothing
 * rehydrates from it, so the SPA boots with a null token and bounces to /auth/login. */
(function () {
  var SESSION_DAYS = 1; // matches the SPA's own non-"remember me" login

  function setCookie(name, value) {
    var expires = new Date(Date.now() + SESSION_DAYS * 86400000).toUTCString();
    // js-cookie decodes %XX on read, so encoding here round-trips (and is a no-op for the
    // base64url/JWT and id charsets these values actually use).
    document.cookie = name + "=" + encodeURIComponent(value) + "; path=/; expires=" + expires +
      "; samesite=lax" + (location.protocol === "https:" ? "; secure" : "");
  }

  var hash = window.location.hash.slice(1);
  var status = document.getElementById("status");
  if (!hash) { status.textContent = "Missing credentials."; return; }
  try {
    var params = JSON.parse(decodeURIComponent(hash));
    if (!params.token || !params.organizationId) throw new Error("incomplete session");

    setCookie("token", params.token);
    setCookie("organization_id", params.organizationId);
    if (params.userId) setCookie("authenticated_user_id", params.userId);
    if (params.tenantId) setCookie("tenant_id", params.tenantId);

    try {
      // An earlier version of this bridge wrote the session here. It never worked, and a leftover
      // value would keep a stale token on disk long after its cookie expired.
      localStorage.removeItem("persist:bigcapital:authentication");
      if (params.returnUrl) localStorage.setItem("docubite:return-url", params.returnUrl);
    } catch (e) {
      /* storage unavailable — the back pill just falls back to "/" */
    }

    // replace(), so the token-bearing fragment leaves the history stack behind.
    window.location.replace(params.redirectPath || "/");
  } catch (e) {
    status.textContent = "Sign-in failed: " + e.message;
  }
})();
</script>
</body>
</html>
