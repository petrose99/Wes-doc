server {
    listen 80 default_server;

    location /api/ {
        proxy_pass http://bigcapital-server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # The skin's own files, mounted from the repo. no-cache because they are edited far more often
    # than the vendor's fingerprinted assets and a stale copy of the theme script is invisible
    # until someone reports the app misbehaving.
    location ~ ^/(docubite-theme\.(css|js)|docubite-mark\.svg|auth-bridge\.html)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # DocuBite skin: strip the hardcoded dark class and inject the theme assets.
    # try_files internally redirects here, so this location serves every SPA page.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        sub_filter '<title>Bigcapital</title>' '<title>Accounting</title>';
        sub_filter '<link rel="icon" href="/favicons/favicon-32.ico" sizes="32x32" />' '<link rel="icon" href="/docubite-mark.svg" type="image/svg+xml" />';
        sub_filter '"Bigcapital Financial Managment Software"' '"DocuBite accounting"';
        sub_filter '<body class="bp4-dark">' '<body>';
        sub_filter '</head>' '<link rel="stylesheet" href="/docubite-theme.css"></head>';
        sub_filter '</body>' '<script src="/docubite-theme.js"></script></body>';
    }
}
