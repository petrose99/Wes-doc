<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DocuBite">
  <!-- The DocuBite mark: a document with a circular bite out of its top-right corner. Geometry
       copied from components/marketing/logo.tsx (BiteMark) with the Tailwind classes resolved —
       emerald-700 #047857 on white. Kept as a standalone file because it is used from three
       places the React component cannot reach. This file serves the favicon, which has to be a
       file; the boot screens inline the same geometry as a data: URI instead (docubite-theme.css
       and auth-bridge.html), because a request for it is a round trip during which the splash is
       a blank box. Three copies, one shape — if the brand mark changes, change all three. -->
  <path fill="#047857" d="M9 3 L20.5 3 A6.5 6.5 0 0 0 27 9.5 L27 25 A4 4 0 0 1 23 29 L9 29 A4 4 0 0 1 5 25 L5 7 A4 4 0 0 1 9 3 Z"/>
  <circle fill="#047857" cx="29.4" cy="13.6" r="1.5"/>
  <rect fill="#ffffff" x="9.5" y="14" width="13" height="2.4" rx="1.2"/>
  <rect fill="#ffffff" x="9.5" y="19.5" width="8.5" height="2.4" rx="1.2"/>
</svg>
